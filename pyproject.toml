[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-world-cellular-ml"
version = "1.0.0"
description = "End-to-end ML pipeline for messy raw-style cellular network telemetry"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
